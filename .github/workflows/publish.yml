name: Publish Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match package.json)"
        required: true
        type: string

  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          # On a release trigger, checkout is at the release tag: the tag and
          # package.json must agree, or fail loudly instead of silently
          # publishing/skipping the wrong version.
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_VERSION="${{ github.event.release.tag_name }}"
            TAG_VERSION="${TAG_VERSION#v}"
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "ERROR: release tag $TAG_VERSION does not match package.json version ($PKG_VERSION)."
              echo "Merge the version bump into the tagged commit before publishing."
              exit 1
            fi
          fi
          if [ -n "${{ inputs.version }}" ] && [ "$PKG_VERSION" != "${{ inputs.version }}" ]; then
            echo "ERROR: package.json version ($PKG_VERSION) != requested version (${inputs.version})"
            exit 1
          fi
          echo "Publishing $NAME@$PKG_VERSION"

      - name: Check if version already published
        id: check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          EXISTING=$(npm view "$NAME@$PKG_VERSION" version 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "::warning::$NAME@$PKG_VERSION already published — skipping (re-run of a published version?)"
            echo "skip_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$PKG_VERSION not on registry — will publish"
            echo "skip_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.skip_publish != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
